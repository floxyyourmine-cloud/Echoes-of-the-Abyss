<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Test Runner</title>
</head>
<body>
  <canvas id="scene" width="640" height="400"></canvas>
  <canvas id="c" width="640" height="400"></canvas>
  <div id="tutPanel" class="hidden"></div>
  <div id="settings" class="hidden"></div>
  <div id="exitPopup" class="hidden"></div>
  <div id="menu" class="hidden"></div>
  <div id="charSel" class="hidden"></div>
  <div id="mobileControls" class="hidden"></div>
  <div id="statModal" class="hidden"></div>
  <div id="ckpt" class="hidden"></div>
  <div id="aldAsk" class="hidden"></div>
  <div id="intro" class="hidden"><canvas id="introCv"></canvas></div>

  <!-- Scripts in order -->
  <script>
    window.onerror = function(msg, url, line, col, error) {
      var d = document.createElement('div');
      d.className = 'script-err';
      d.textContent = 'SCRIPT_ERROR: ' + url + ':' + line + ':' + col + ' ' + msg;
      document.body.appendChild(d);
    };
  </script>
  <script src="js/save-system.js"></script>
  <script src="js/main.js"></script>
  <script src="js/player.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/dungeon.js"></script>
  <script src="js/lobby.js"></script>
  <script src="js/forest.js"></script>
  <script src="js/village.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/multiplayer.js"></script>

  <div id="test-results">RUNNING</div>

  <script>
    const logs = [];
    const errs = [];
    window.onerror = function(msg, url, line, col, error) {
      errs.push({ msg, url, line, col, err: String(error) });
      console.error("WINDOW ERROR:", msg, line, col);
    };

    function assert(cond, desc) {
      if (!cond) {
        throw new Error("ASSERTION FAILED: " + desc);
      }
      logs.push("PASS: " + desc);
    }

    try {
      // 1. Basic initialization
      assert(typeof window.WORLD !== 'undefined', "WORLD object exists");
      assert(typeof window.WORLD.AREAS !== 'undefined', "WORLD.AREAS exists");
      
      // 2. Check all areas registered
      assert(typeof window.WORLD.AREAS.corridor !== 'undefined', "corridor area registered");
      assert(typeof window.WORLD.AREAS.forest !== 'undefined', "forest area registered");
      assert(typeof window.WORLD.AREAS.village !== 'undefined', "village area registered");

      // 3. Check Corridor build
      const C = window.WORLD.AREAS.corridor;
      assert(typeof C.build === 'function', "Corridor has build function");
      C.build();
      assert(C.walls.length > 0, "Corridor walls built: " + C.walls.length);
      assert(C.npcs.length >= 3, "Corridor NPCs registered: " + C.npcs.length);

      // 4. Check Forest build
      const F = window.WORLD.AREAS.forest;
      assert(typeof F.build === 'function', "Forest has build function");
      F.build();
      assert(F.objs.length > 0, "Forest objects built: " + F.objs.length);
      assert(F.chests.length >= 4, "Forest chests built: " + F.chests.length);

      // 5. Check Village build
      const V = window.WORLD.AREAS.village;
      assert(typeof V.build === 'function', "Village has build function");
      V.build();
      assert(V.objs.length > 0, "Village objects built: " + V.objs.length);
      assert(V.npcs.length > 0, "Village NPCs built: " + V.npcs.length);

      // 6. Check transitions exist
      const SEQ = window.WORLD.SEQ;
      assert(typeof SEQ.emerge === 'object', "SEQ.emerge exists");
      assert(typeof SEQ.toForest === 'object', "SEQ.toForest exists");
      assert(typeof SEQ.toLobby === 'object', "SEQ.toLobby exists");
      assert(typeof SEQ.gate === 'object', "SEQ.gate exists");
      assert(typeof SEQ.corridorToForest === 'object', "SEQ.corridorToForest exists");
      assert(typeof SEQ.corridorToLobby === 'object', "SEQ.corridorToLobby exists");
      assert(typeof SEQ.portalLobby === 'object', "SEQ.portalLobby exists");

      // 7. Check Area switching
      window.WORLD.setArea('corridor');
      assert(window.AREA === 'corridor', "Switched to corridor");

      window.WORLD.setArea('forest');
      assert(window.AREA === 'forest', "Switched to forest");

      window.WORLD.setArea('village');
      assert(window.AREA === 'village', "Switched to village");

      window.WORLD.setLobby();
      assert(window.AREA === 'lobby', "Switched to lobby");

      // 8. Check Dungeon systems
      assert(typeof buildLavaBossBG === 'function', "buildLavaBossBG exists in dungeon.js");
      assert(typeof buildLavaRoom === 'function', "buildLavaRoom exists in dungeon.js");
      assert(typeof buildEndBG === 'function', "buildEndBG exists in dungeon.js");
      assert(typeof enterDungeon === 'function', "enterDungeon exists in dungeon.js");

      // 9. Check Combat systems
      assert(typeof drawRock === 'function', "drawRock exists in combat.js");
      assert(typeof pfire === 'function', "pfire exists in combat.js");
      assert(typeof hurt === 'function', "hurt exists in combat.js");

      document.getElementById('test-results').innerText = "ALL_TESTS_PASSED:\n" + logs.join("\n");
      console.log("=== ALL_TESTS_PASSED ===");
    } catch (e) {
      document.getElementById('test-results').innerText = "TEST_FAILED: " + e.message + "\nStack: " + e.stack;
      console.error("TEST FAILED:", e);
    }
  </script>
</body>
</html>
